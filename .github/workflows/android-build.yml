name: Android Build

on:
  push:
    branches: [main]

jobs:
  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The runner's default JDK is newer than this project's Gradle
      # wrapper supports. Pin a known-compatible JDK for the Android
      # build instead of bumping Gradle/AGP further than necessary.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # Debug build: uses Android's auto-generated debug keystore, no
      # signing secrets needed. (Release builds currently need a real
      # keystore wired up first — see android/app/build.gradle.kts.)
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: service-provider-app-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # actions/upload-artifact always wraps its output in a zip, even
      # for a single file. Publish the raw .apk as a release asset too,
      # so there's a direct-download link with no unzip step. Reuses
      # the same tag each run, so this is always "the latest build".
      - name: Publish APK to latest-debug-build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug-build
          name: Latest debug build
          body: Automatically rebuilt from ${{ github.sha }} on every push to main. Not a versioned release.
          prerelease: true
          files: build/app/outputs/flutter-apk/app-debug.apk
