name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      # No test files exist yet; --passWithNoTests keeps this green until some are added.
      - name: Test
        run: npm test -- --passWithNoTests

  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # Repo has pre-existing lint findings (deprecated API usage, avoid_print, etc.)
      # unrelated to any given change; keep this informational until that debt is paid down.
      - name: Analyze (non-blocking)
        run: flutter analyze
        continue-on-error: true

      - name: Test
        run: flutter test
